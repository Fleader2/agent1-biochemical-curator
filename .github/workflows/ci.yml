name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agent1
          POSTGRES_PASSWORD: agent1
          POSTGRES_DB: agent1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://agent1:agent1@localhost:5432/agent1
      TEST_DATABASE_URL: postgresql+psycopg://agent1:agent1@localhost:5432/agent1_test
      APP_ENV: ci
      LOG_FORMAT: json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Create test database
        run: psql "$DATABASE_URL_PSQL" -c 'CREATE DATABASE agent1_test'
        env:
          DATABASE_URL_PSQL: postgresql://agent1:agent1@localhost:5432/agent1
          PGPASSWORD: agent1

      - name: Ruff
        run: ruff check .

      - name: Alembic migrations from empty database
        run: alembic upgrade head

      - name: Tests
        run: pytest --cov=app --cov-report=term-missing
